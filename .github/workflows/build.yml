name: Build MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pillow pyinstaller
          dir

      - name: Fix missing icons
        run: |
          if (-not (Test-Path "assets")) { mkdir assets }
          if (-not (Test-Path "logo.png")) { echo "No logo.png found - build will use dummy icons" }

      - name: Build EXE
        run: |
          if (Test-Path "INSITEVA.spec") {
            pyinstaller INSITEVA.spec --noconfirm
          } elseif (Test-Path "main.py") {
            pyinstaller --onefile --windowed --name INSITEVA main.py --noconfirm
          } else {
            echo "Skipping EXE build - checking for existing EXE"
            Get-ChildItem -Recurse -Filter "*.exe" | Select-Object -First 5
          }

      - name: Make MSIX
        run: |
          Get-ChildItem -Recurse -Filter make_msix.py
          if (Test-Path "./make_msix.py") {
            python ./make_msix.py
          } else {
            $found = Get-ChildItem -Recurse -Filter make_msix.py | Select-Object -First 1
            python $found.FullName
          }

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: INSITEVA-MSIX
          path: "*.msix"
