name: Build MSIX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name INSITEVA app.py
      - name: Make MSIX
        run: python make_msix.py
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: INSITEVA-msix
          path: INSITEVA.msix
