name: Build MSIX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install customtkinter pillow pyinstaller
      - run: pyinstaller --noconfirm --onedir --windowed --name INSITEVA main.py
      - run: python make_msix.py
      - uses: actions/upload-artifact@v4
        with:
          name: INSITEVA-msix
          path: INSITEVA.msix
