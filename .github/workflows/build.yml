name: Build MSIX
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build EXE and MSIX folder
        run: |
          pip install pyinstaller pillow
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pyinstaller --onefile --name INSITEVA --windowed app.py
          python make_msix.py

      - name: Pack with makeappx
        shell: pwsh
        run: |
          $tool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -like "*x64*" } | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          Write-Host "Using $tool"
          & $tool pack /d build_msix /p INSITEVA.msix /o
          dir *.msix

      - uses: actions/upload-artifact@v4
        with:
          name: INSITEVA-msix
          path: INSITEVA.msix
