name: Build Windows MSIX
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Fix missing assets and icon
        run: |
          New-Item -ItemType Directory -Force -Path assets
          New-Item -ItemType Directory -Force -Path insiteva-desktop/assets
          # create dummy icon if missing - PyInstaller needs a valid .ico
          python -c "from PIL import Image; import os; img=Image.new('RGBA',(256,256),(0,120,255,255)); 
          paths=['insiteva.ico','app.ico','icon.ico','assets/icon.ico','insiteva-desktop/insiteva.ico']; 
          [img.save(p) or print(f'Created {p}') for p in paths if not os.path.exists(p)]"

      - name: Build EXE
        run: pyinstaller INSITEVA.spec --noconfirm --clean

      - name: Make MSIX
        run: python make_msix.py

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: INSITEVA-msix-1.0.12.0
          path: "*.msix"
