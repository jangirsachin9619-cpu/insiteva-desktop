name: Build MSIX
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
      - name: Build EXE
        run: pyinstaller --onefile --name INSITEVA --windowed app.py
      - name: Prepare folder
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build_msix -ErrorAction SilentlyContinue
          mkdir build_msix
          mkdir build_msix/Assets
          Copy-Item dist/INSITEVA.exe build_msix/
          $b64 = "[STRIPPED 92 bytes]"
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes("build_msix/Assets/Square150x150Logo.png", $bytes)
          [IO.File]::WriteAllBytes("build_msix/Assets/Square44x44Logo.png", $bytes)
          [IO.File]::WriteAllBytes("build_msix/Assets/StoreLogo.png", $bytes)
      - name: Create Manifest
        shell: pwsh
        run: |
          Set-Content -Path build_msix/AppxManifest.xml -Value @'
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
            <Identity Name="Insiteva.INSITEVA" Publisher="CN=4D02E3C1-2496-4104-A71A-89481814EBE0" Version="1.0.5.0" ProcessorArchitecture="x64"/>
            <Properties><DisplayName>INSITEVA</DisplayName><PublisherDisplayName>Insiteva</PublisherDisplayName><Logo>Assets\StoreLogo.png</Logo></Properties>
            <Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" /></Dependencies>
            <Resources><Resource Language="en-us" /></Resources>
            <Applications><Application Id="App" Executable="INSITEVA.exe" EntryPoint="Windows.FullTrustApplication"><uap:VisualElements DisplayName="INSITEVA" Description="INSITEVA" BackgroundColor="transparent" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" /></Application></Applications>
            <Capabilities><rescap:Capability Name="runFullTrust" /></Capabilities>
          </Package>
          '@
          Set-Content -Path build_msix/[Content_Types].xml -Value '<?xml version="1.0" encoding="utf-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="exe" ContentType="application/vnd.microsoft.portable-exe" /><Default Extension="png" ContentType="image/png" /><Default Extension="xml" ContentType="application/xml" /></Types>'
      - name: Pack with makeappx
        shell: pwsh
        run: |
          $tool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          & $tool pack /d build_msix /p INSITEVA.msix /o
      - uses: actions/upload-artifact@v4
        with:
          name: INSITEVA-msix
          path: INSITEVA.msix
