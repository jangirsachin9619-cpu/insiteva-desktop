name: Build Windows MSIX
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
      - name: Fix missing icons
        run: |
          mkdir Assets -Force
          python -c "
          from PIL import Image
          import os
          src = 'insiteva_logo.png' if os.path.exists('insiteva_logo.png') else 'insiteva_icon.png'
          im = Image.open(src).convert('RGBA')
          im.resize((44,44)).save('Assets/Square44x44Logo.png')
          im.resize((50,50)).save('Assets/StoreLogo.png')
          im.resize((150,150)).save('Assets/Square150x150Logo.png')
          im.resize((310,310)).save('Assets/Square310x310Logo.png')
          im.resize((310,150)).save('Assets/Wide310x150Logo.png')
          print('Icons created from', src)
          "
      - name: Build EXE
        run: pyinstaller INSITEVA.spec --noconfirm --clean
      - name: Make MSIX
        run: python make_msix.py
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: INSITEVA-msix-1.0.15.0
          path: "*.msix"
